[project]
name = "deploy-open-model"
version = "0.1.0"
description = "Serve an open model with vLLM and measure TTFT, inter-token latency and throughput."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "matplotlib>=3.8"]

[project.optional-dependencies]
serve = ["vllm"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
